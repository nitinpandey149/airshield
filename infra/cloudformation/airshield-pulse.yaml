AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AirShield Pulse - AWS infrastructure. Every resource here has a specific job
  in the forecast or notification pipeline; none is decorative.

  Forecast pipeline:
    EventBridge schedule -> ingest Lambda -> S3 (training data) + DynamoDB (state)
    SageMaker AI (training + inference endpoint) -> FastAPI service

  Notification pipeline:
    EventBridge schedule -> spike Lambda -> SNS topic -> subscribers

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  LocationSlug:
    Type: String
    Default: berlin
    Description: Location the scheduled ingestion samples.
  Latitude:
    Type: Number
    Default: 52.52
  Longitude:
    Type: Number
    Default: 13.405
  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email to subscribe to spike notifications.
  ApiBaseUrl:
    Type: String
    Default: "http://localhost:8000"
    Description: Base URL of the deployed AirShield Pulse FastAPI service.

Conditions:
  HasEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "airshield-pulse-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-samples
            Status: Enabled
            ExpirationInDays: 400
            Prefix: samples/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --------------------------------------------------------------- state
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "airshield-pulse-${Environment}-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ----------------------------------------------------------- notifications
  SpikeTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "airshield-pulse-${Environment}-spikes"
      DisplayName: AirShield Pulse pollution spikes

  SpikeEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref SpikeTopic

  # ------------------------------------------------------------ ingest lambda
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: airshield-ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub "${DataBucket.Arn}/samples/*"
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt StateTable.Arn

  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "airshield-pulse-${Environment}-ingest"
      Runtime: python3.12
      Handler: handler.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt IngestRole.Arn
      Environment:
        Variables:
          AIRSHIELD_BUCKET: !Ref DataBucket
          AIRSHIELD_TABLE: !Ref StateTable
          AIRSHIELD_LATITUDE: !Ref Latitude
          AIRSHIELD_LONGITUDE: !Ref Longitude
          AIRSHIELD_LOCATION_SLUG: !Ref LocationSlug
      Code:
        ZipFile: |
          """Scheduled ingestion Lambda for AirShield Pulse.

          Runs on an EventBridge schedule. Fetches real hourly air-quality and weather
          observations from Open-Meteo for the configured location, stores them as a JSON
          sample in S3 (training-data archive) and records the latest reading in DynamoDB
          (serving state).

          Nothing is synthesised: if Open-Meteo cannot be reached, the invocation fails
          with a clear error so CloudWatch records it and the sample is simply not written.
          """

          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          AIR_QUALITY_URL = "https://air-quality-api.open-meteo.com/v1/air-quality"
          WEATHER_URL = "https://api.open-meteo.com/v1/forecast"
          AIR_HOURLY = "pm2_5,pm10,nitrogen_dioxide,ozone"
          WEATHER_HOURLY = (
              "temperature_2m,relative_humidity_2m,wind_speed_10m,"
              "wind_direction_10m,surface_pressure,precipitation"
          )


          def _get(url: str, params: dict, timeout: float = 20.0) -> dict:
              query = urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  f"{url}?{query}", headers={"User-Agent": "AirShield-Pulse/1.0"}
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))


          def _fetch(latitude: float, longitude: float) -> dict:
              common = {"latitude": latitude, "longitude": longitude, "past_days": 2, "forecast_days": 1, "timezone": "UTC"}
              air = _get(AIR_QUALITY_URL, {**common, "hourly": AIR_HOURLY})
              weather = _get(WEATHER_URL, {**common, "hourly": WEATHER_HOURLY})

              times = (air.get("hourly") or {}).get("time") or []
              if not times:
                  raise RuntimeError("Open-Meteo returned no hourly air-quality times")

              air_hourly = air.get("hourly") or {}
              weather_hourly = weather.get("hourly") or {}
              rows = []
              for index, stamp in enumerate(times):
                  row = {"time": stamp}
                  for key in AIR_HOURLY.split(","):
                      series = air_hourly.get(key) or []
                      row[key] = series[index] if index < len(series) else None
                  for key in WEATHER_HOURLY.split(","):
                      series = weather_hourly.get(key) or []
                      row[key] = series[index] if index < len(series) else None
                  rows.append(row)

              return {
                  "latitude": latitude,
                  "longitude": longitude,
                  "fetched_at": datetime.now(timezone.utc).isoformat(),
                  "source": {
                      "name": "Open-Meteo",
                      "url": AIR_QUALITY_URL,
                      "licence": "CC BY 4.0 (https://open-meteo.com/en/license)",
                  },
                  "rows": rows,
              }


          def handler(event, context):  # noqa: ANN001 - AWS Lambda signature
              import boto3

              bucket = os.environ["AIRSHIELD_BUCKET"]
              table = os.environ["AIRSHIELD_TABLE"]
              slug = os.environ.get("AIRSHIELD_LOCATION_SLUG", "berlin")
              latitude = float(os.environ.get("AIRSHIELD_LATITUDE", "52.52"))
              longitude = float(os.environ.get("AIRSHIELD_LONGITUDE", "13.405"))

              payload = _fetch(latitude, longitude)
              now = datetime.now(timezone.utc)
              key = f"samples/{slug}/{now:%Y/%m/%d}/{now:%H%M%S}.json"

              s3 = boto3.client("s3")
              s3.put_object(
                  Bucket=bucket,
                  Key=key,
                  Body=json.dumps(payload).encode("utf-8"),
                  ContentType="application/json",
              )

              # Latest measured row (PM2.5 not null) for the serving state.
              measured = [row for row in payload["rows"] if row.get("pm2_5") is not None]
              if not measured:
                  raise RuntimeError("no measured PM2.5 in the fetched sample")
              latest = measured[-1]

              dynamodb = boto3.resource("dynamodb")
              dynamodb.Table(table).put_item(
                  Item={
                      "pk": f"LOCATION#{slug}",
                      "sk": f"OBS#{latest['time']}",
                      "location_slug": slug,
                      "time": latest["time"],
                      "pm2_5": str(latest["pm2_5"]),
                      "latitude": str(latitude),
                      "longitude": str(longitude),
                      "s3_key": key,
                      "ingested_at": now.isoformat(),
                      # Samples expire after 90 days unless promoted to a training set.
                      "expires_at": int(now.timestamp()) + 90 * 86400,
                  }
              )

              return {"stored": key, "latest_time": latest["time"], "pm2_5": latest["pm2_5"]}
  # ------------------------------------------------------------- spike lambda
  SpikeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: airshield-spike
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sns:Publish]
                Resource: !Ref SpikeTopic
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: [sagemaker:InvokeEndpoint]
                Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*"

  SpikeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "airshield-pulse-${Environment}-spike"
      Runtime: python3.12
      Handler: handler.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt SpikeRole.Arn
      Environment:
        Variables:
          AIRSHIELD_TABLE: !Ref StateTable
          AIRSHIELD_SNS_TOPIC_ARN: !Ref SpikeTopic
          AIRSHIELD_LOCATION_SLUG: !Ref LocationSlug
          AIRSHIELD_API_BASE_URL: !Ref ApiBaseUrl
      Code:
        ZipFile: |
          """Pollution-spike notification Lambda for AirShield Pulse.

          Runs on an EventBridge schedule. Calls the AirShield Pulse API for the latest
          forecast, and when a pollution spike is predicted publishes a notification to
          SNS. A spike is only notified once per hour (de-duplicated through DynamoDB), so
          subscribers are not spammed.

          The notification text is built from the API response verbatim. This function
          never invents a spike, a confidence or an expected change: if the API is
          unreachable it raises, and CloudWatch records the failure.
          """

          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone


          def _get_json(url: str, timeout: float = 20.0) -> dict:
              request = urllib.request.Request(
                  url, headers={"Accept": "application/json", "User-Agent": "AirShield-Pulse/1.0"}
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))


          def _message(forecast: dict) -> tuple[str, str]:
              location = forecast["location"]["label"]
              spike = forecast.get("spike") or {}
              current = forecast.get("current") or {}
              change = spike.get("expected_change_percent", 0)
              when = spike.get("expected_time") or "soon"
              subject = f"AirShield Pulse: pollution spike expected in {location}"
              body = (
                  f"A pollution spike is predicted for {location}.\n\n"
                  f"Expected time: {when}\n"
                  f"Expected change: {change:+.0f}%\n"
                  f"Severity: {spike.get('severity', 'unknown')}\n"
                  f"Confidence: {spike.get('confidence', 0) * 100:.0f}% "
                  f"(basis: {spike.get('confidence_basis', 'unknown')})\n"
                  f"Current PM2.5: {current.get('pm2_5', 'n/a')} ug/m3\n\n"
                  "This is a forecast-based alert, not medical advice. Consider moving "
                  "outdoor activity to a lower-exposure window. Open the dashboard for the "
                  "recommended window and lower-exposure route.\n\n"
                  "Contributing signals are associated conditions, not proven causes."
              )
              return subject, body


          def handler(event, context):  # noqa: ANN001 - AWS Lambda signature
              import boto3

              base_url = os.environ.get("AIRSHIELD_API_BASE_URL", "http://localhost:8000").rstrip("/")
              slug = os.environ.get("AIRSHIELD_LOCATION_SLUG", "berlin")
              topic_arn = os.environ["AIRSHIELD_SNS_TOPIC_ARN"]
              table_name = os.environ.get("AIRSHIELD_TABLE")

              forecast = _get_json(f"{base_url}/api/forecast/{slug}")
              spike = forecast.get("spike") or {}

              if not spike.get("spike_detected"):
                  return {"notified": False, "reason": "no spike predicted"}

              expected_time = spike.get("expected_time") or ""
              hour_key = expected_time[:13]  # YYYY-MM-DDTHH

              if table_name:
                  dynamodb = boto3.resource("dynamodb")
                  table = dynamodb.Table(table_name)
                  dedupe_pk = f"SPIKE#{slug}"
                  dedupe_sk = f"NOTIFIED#{hour_key}"
                  existing = table.get_item(Key={"pk": dedupe_pk, "sk": dedupe_sk}).get("Item")
                  if existing:
                      return {"notified": False, "reason": "already notified for this hour"}

              subject, body = _message(forecast)
              sns = boto3.client("sns")
              sns.publish(TopicArn=topic_arn, Subject=subject[:100], Message=body)

              if table_name:
                  now = datetime.now(timezone.utc)
                  table.put_item(
                      Item={
                          "pk": f"SPIKE#{slug}",
                          "sk": f"NOTIFIED#{hour_key}",
                          "location_slug": slug,
                          "expected_time": expected_time,
                          "severity": spike.get("severity"),
                          "expected_change_percent": str(spike.get("expected_change_percent", 0)),
                          "confidence": str(spike.get("confidence", 0)),
                          "confidence_basis": spike.get("confidence_basis"),
                          "notified_at": now.isoformat(),
                          "expires_at": int(now.timestamp()) + 7 * 86400,
                      }
                  )

              return {"notified": True, "expected_time": expected_time}
  # -------------------------------------------------------------- schedules
  IngestSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "airshield-pulse-${Environment}-ingest"
      Description: Ingest Open-Meteo observations hourly
      ScheduleExpression: "rate(1 hour)"
      State: ENABLED
      Targets:
        - Id: ingest
          Arn: !GetAtt IngestFunction.Arn

  IngestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestSchedule.Arn

  SpikeSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "airshield-pulse-${Environment}-spike"
      Description: Check the forecast for a pollution spike every 30 minutes
      ScheduleExpression: "rate(30 minutes)"
      State: ENABLED
      Targets:
        - Id: spike
          Arn: !GetAtt SpikeFunction.Arn

  SpikePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SpikeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SpikeSchedule.Arn

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
    Description: Set AIRSHIELD_S3_BUCKET to this value
  StateTableName:
    Value: !Ref StateTable
    Description: Set AIRSHIELD_DYNAMODB_TABLE to this value
  SpikeTopicArn:
    Value: !Ref SpikeTopic
    Description: Set AIRSHIELD_SNS_TOPIC_ARN to this value
  IngestFunctionName:
    Value: !Ref IngestFunction
    Description: Set AIRSHIELD_LAMBDA_FUNCTION to this value
  IngestScheduleName:
    Value: !Ref IngestSchedule
    Description: Set AIRSHIELD_EVENTBRIDGE_SCHEDULE to this value
